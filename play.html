<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>点点乐 · 试玩</title>
<style>
  :root { --bg:#F6F1E7; --panel:#FFFFFF; --ink:#2B2233; --muted:#8A8191; --line:#E8E1D4; --accent:#FF8A3D; --gold:#FFB020; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; overflow:hidden; }
  body.fever { background:#FFF4D6; }
  .wrap { max-width:560px; margin:0 auto; height:100%; display:flex; flex-direction:column; padding:12px 16px; }
  .top { display:flex; align-items:center; gap:10px; }
  .coins { display:flex; align-items:center; gap:8px; background:var(--panel); border-radius:999px; padding:6px 14px 6px 8px; font-weight:800; font-size:20px; box-shadow:0 2px 0 var(--line); }
  .coins i { width:26px; height:26px; border-radius:50%; background:#FFC93C; border:3px solid #E0A91F; display:inline-block; }
  .coins.pop { animation:pop .25s cubic-bezier(.28,2.1,.5,1); }
  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.18); } 100% { transform:scale(1); } }
  select { margin-left:auto; font:inherit; border:1px solid var(--line); border-radius:10px; padding:6px 8px; background:var(--panel); color:inherit; }
  .meter { margin-top:12px; display:flex; align-items:center; gap:10px; font-weight:700; }
  .bar { flex:1; height:14px; background:var(--panel); border-radius:999px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
  .bar b { display:block; height:100%; width:0; background:linear-gradient(90deg,#FFC93C,#FF8A3D,#FF5C8A); border-radius:999px; transition:width .08s; }
  .speed { min-width:58px; text-align:right; font-variant-numeric:tabular-nums; }
  .combo { min-width:84px; font-variant-numeric:tabular-nums; }
  .stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; user-select:none; }
  #char { width:min(100%, 72vh); aspect-ratio:1; }
  /* effects (rays, coins flying to the counter) may leave the character's square */
  #char svg { overflow:visible; }
  .banner { position:absolute; top:6%; left:0; right:0; text-align:center; font-size:56px; font-weight:900; color:var(--gold); -webkit-text-stroke:3px #fff; paint-order:stroke; opacity:0; transform:scale(.6); transition:all .25s cubic-bezier(.28,2.1,.5,1); pointer-events:none; }
  body.fever .banner { opacity:1; transform:scale(1); }
  .hint { text-align:center; color:var(--muted); padding-bottom:6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="coins" id="coins"><i></i><span id="coinN">0</span></div>
    <select id="who"></select>
  </div>
  <div class="meter">
    <span class="combo" id="combo">连击 0</span>
    <div class="bar"><b id="bar"></b></div>
    <span class="speed" id="speed">×1.0</span>
  </div>
  <div class="stage" id="stage"><div id="char"></div><div class="banner">FEVER!</div></div>
  <div class="hint">点它！狂点加速，连击 25 进入 FEVER</div>
</div>

<script src="engine/ipm.js"></script>
<script src="engine/fx.js"></script>
<script src="engine/motions.js"></script>
<script src="characters/index.js"></script>
<script>
// Tap-game playground (references/game-juice.md): every tap = reaction + layered particles at the pointer;
// tapping fast raises the combo, which speeds playback up to 1.8× and escalates the feedback; 25 = FEVER.
const $ = (s) => document.querySelector(s);
let rig, svg, stageEl;
let combo = 0, lastTap = -9, coins = 0, fever = false, lastVariant = 0, seed = 1;
let baseT = 0, react = null; // react = { name, t }
let rays = 0;
const clock = () => performance.now() / 1000;

for (const id in IPM.characters) $('#who').add(new Option(IPM.characters[id].name, id));

async function load(id) {
  rig = await IPM.mount($('#char'), id);
  svg = $('#char svg');
  stageEl = svg.querySelector('[data-part="stage"]');
}

// pointer / element → stage coordinates (feet centre = 0,0)
function toStage(cx, cy) {
  const p = svg.createSVGPoint();
  p.x = cx; p.y = cy;
  return p.matrixTransform(stageEl.getScreenCTM().inverse());
}

function tap(e) {
  if (!rig) return;
  const now = clock();
  combo = now - lastTap < 0.8 ? combo + 1 : Math.max(1, combo * 0.5);
  lastTap = now;
  const k = Math.min(1, combo / 25), sp = 1 + Math.min(0.8, combo * 0.03);
  // a different reaction every time
  let v;
  do v = 1 + Math.floor(Math.random() * 4); while (v === lastVariant);
  lastVariant = v;
  react = { name: `tap@${v}q`, t: 0 };
  // feedback at the pointer; coins fly to the counter
  const at = toStage(e.clientX, e.clientY);
  const r = $('#coins').getBoundingClientRect();
  const target = toStage(r.left + 20, r.top + r.height / 2);
  const value = k < 0.2 ? 1 : k < 0.5 ? 2 : k < 0.85 ? 5 : 10;
  seed += 7;
  const evs = IPM.juice.tapFx(now, k, value, seed, at.x).map((ev) => {
    const out = Object.assign({}, ev);
    if (ev.y !== undefined) out.y = ev.y + (at.y + 200); // tapFx is authored around the chest (y −200)
    if (ev.type === 'coin') Object.assign(out, { to: [target.x, target.y], life: 0.9 });
    return out;
  });
  evs.forEach((ev) => rig.fx.spawn(ev));
  setTimeout(() => { coins += value * (3 + Math.round(7 * k)); $('#coinN').textContent = coins; bump(); }, 800 / sp);
  if (!fever && combo >= 25) startFever(now);
}

function bump() {
  const c = $('#coins');
  c.classList.remove('pop');
  void c.offsetWidth;
  c.classList.add('pop');
}

function startFever(now) {
  fever = true;
  document.body.classList.add('fever');
  rig.fx.spawn({ t: now, type: 'confetti', n: 70, x: 0, y: -620, dir: 90, spread: 70, speed: [60, 260], gravity: 420, life: 2.4, stagger: 0.012, seed: seed + 900 });
  rig.fx.spawn({ t: now, type: 'ring', x: 0, y: -200, life: 0.45, size: 2.4, color: '#FFD84D', seed: seed + 901 });
}

$('#stage').addEventListener('pointerdown', tap);
$('#who').addEventListener('change', (e) => load(e.target.value));

let prev = clock();
function frame() {
  const now = clock(), dt = Math.min(0.1, now - prev);
  prev = now;
  if (rig) {
    // combo decays slowly once you stop (slower than it rises)
    if (now - lastTap > 0.8) combo = Math.max(0, combo - dt * 10);
    const sp = 1 + Math.min(0.8, combo * 0.03);
    if (fever && combo < 10) { fever = false; document.body.classList.remove('fever'); }
    if (fever && now > rays) { rig.fx.spawn({ t: now, type: 'rays', x: 0, y: -220, speed: [0, 0], gravity: 0, life: 3, size: 1.2, seed: 7 }); rays = now + 2.4; }
    $('#combo').textContent = `连击 ${Math.floor(combo)}`;
    $('#bar').style.width = `${Math.min(100, (combo / 25) * 100)}%`;
    $('#speed').textContent = `×${sp.toFixed(1)}`;
    baseT += dt * sp;
    if (react) {
      react.t += dt * sp;
      const m = rig.pose(react.name, react.t, now);
      if (react.t > m.duration) react = null;
    } else {
      const base = fever ? 'dance' : now - lastTap > 4 ? 'beckon' : 'idle';
      rig.pose(base, baseT, now);
    }
  }
  requestAnimationFrame(frame);
}
load('young').then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
