<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- 骗子 scammer · origin = feet centre, y up is negative · same part names as young so all templates apply -->
  <defs>
    <clipPath id="scammer-shirt"><rect x="-76" y="-208" width="152" height="136" rx="34"/></clipPath>
  </defs>
  <g transform="translate(300 560)">
    <g data-part="shadow" data-pivot="0 0">
      <ellipse cx="0" cy="0" rx="80" ry="12" fill="#000" opacity="0.12"/>
    </g>
    <g data-part="root" data-pivot="0 0">
      <g data-part="body" data-pivot="0 0">

        <g data-part="leg_l" data-pivot="-26 -86">
          <rect x="-43" y="-96" width="34" height="84" rx="12" fill="#3A3A48"/>
          <path d="M -50 0 L -50 -16 Q -50 -26 -38 -26 L -10 -26 Q -4 -26 -4 -18 L -4 0 Z" fill="#6B3E26"/>
          <path d="M -50 -16 Q -64 -10 -66 0 L -50 0 Z" fill="#6B3E26"/>
        </g>
        <g data-part="leg_r" data-pivot="26 -86">
          <rect x="9" y="-96" width="34" height="84" rx="12" fill="#3A3A48"/>
          <path d="M 50 0 L 50 -16 Q 50 -26 38 -26 L 10 -26 Q 4 -26 4 -18 L 4 0 Z" fill="#6B3E26"/>
          <path d="M 50 -16 Q 64 -10 66 0 L 50 0 Z" fill="#6B3E26"/>
        </g>

        <g data-part="torso" data-pivot="0 -84">
          <rect x="-76" y="-208" width="152" height="136" rx="34" fill="#8A4FD8"/>
          <!-- hawaiian print, clipped to the shirt -->
          <g clip-path="url(#scammer-shirt)">
            <g fill="#FFD84D"><circle cx="-52" cy="-150" r="9"/><circle cx="40" cy="-118" r="9"/><circle cx="-20" cy="-96" r="9"/><circle cx="62" cy="-180" r="9"/></g>
            <g fill="#FF7FB0"><circle cx="-48" cy="-108" r="7"/><circle cx="54" cy="-146" r="7"/><circle cx="12" cy="-140" r="6"/></g>
            <g fill="#6A35B8"><circle cx="-60" cy="-186" r="5"/><circle cx="-6" cy="-178" r="4"/><circle cx="28" cy="-92" r="5"/></g>
          </g>
          <rect x="-74" y="-86" width="148" height="14" rx="7" fill="#3A3A48"/>
          <!-- open V neck with a gold chain -->
          <path d="M -26 -210 L 0 -164 L 26 -210 Z" fill="#FFD3B0"/>
          <path d="M -20 -206 Q 0 -176 20 -206" fill="none" stroke="#F2C230" stroke-width="4"/>
          <path d="M -30 -212 L -2 -166 L -46 -186 Z" fill="#6A35B8"/>
          <path d="M 30 -212 L 2 -166 L 46 -186 Z" fill="#6A35B8"/>

          <g data-part="head" data-pivot="0 -198">
            <rect x="-96" y="-290" width="20" height="36" rx="10" fill="#F2B48C"/>
            <rect x="76" y="-290" width="20" height="36" rx="10" fill="#F2B48C"/>
            <rect x="-86" y="-358" width="172" height="166" rx="56" fill="#FFD3B0"/>

            <!-- slicked-back hair with a shine -->
            <path d="M -90 -292 C -96 -352 -50 -378 0 -376 C 50 -378 96 -352 90 -292
                     C 86 -322 68 -340 38 -342 C 8 -344 -40 -338 -68 -324 C -80 -316 -88 -304 -90 -292 Z" fill="#1F1B2E"/>
            <path d="M -40 -362 Q 0 -372 42 -360" fill="none" stroke="#4A4466" stroke-width="5" stroke-linecap="round"/>
            <g data-part="hair_lock" data-pivot="-8 -340">
              <path d="M -18 -342 C -32 -322 -26 -300 -8 -294 C -16 -306 -14 -322 -2 -342 Z" fill="#1F1B2E"/>
            </g>

            <g data-part="eyes" data-pivot="0 -274">
              <rect x="-54" y="-292" width="34" height="36" rx="12" fill="#FFFFFF"/>
              <rect x="20" y="-292" width="34" height="36" rx="12" fill="#FFFFFF"/>
              <g data-part="pupils" data-pivot="0 -274">
                <rect x="-45" y="-282" width="16" height="21" rx="7" fill="#2B2233"/>
                <rect x="29" y="-282" width="16" height="21" rx="7" fill="#2B2233"/>
                <rect x="-39" y="-279" width="5" height="5" rx="2.5" fill="#FFFFFF"/>
                <rect x="35" y="-279" width="5" height="5" rx="2.5" fill="#FFFFFF"/>
              </g>
              <!-- heavy upper lids: the half-closed look is the character -->
              <path d="M -56 -294 L -18 -294 L -18 -278 Q -37 -272 -56 -280 Z" fill="#F2B48C"/>
              <path d="M 56 -294 L 18 -294 L 18 -278 Q 37 -272 56 -280 Z" fill="#F2B48C"/>
            </g>

            <!-- thin brows, outer ends arched up by default -->
            <g data-part="brow_l" data-pivot="-37 -310">
              <rect x="-56" y="-314" width="38" height="7" rx="3.5" fill="#1F1B2E" transform="rotate(-12 -37 -310)"/>
            </g>
            <g data-part="brow_r" data-pivot="37 -310">
              <rect x="18" y="-314" width="38" height="7" rx="3.5" fill="#1F1B2E" transform="rotate(12 37 -310)"/>
            </g>

            <rect x="-8" y="-258" width="16" height="18" rx="8" fill="#F2B48C"/>
            <!-- pencil moustache -->
            <path d="M -30 -236 Q -16 -246 0 -240 Q 16 -246 30 -236 Q 16 -240 0 -235 Q -16 -240 -30 -236 Z" fill="#1F1B2E"/>

            <g data-part="mouth" data-pivot="0 -222">
              <g data-group="mouth" data-swap="smirk" data-default="">
                <path d="M -18 -224 Q 2 -216 22 -232" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="smile">
                <path d="M -18 -228 Q 0 -214 18 -228" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="flat">
                <path d="M -12 -222 L 12 -222" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="sad">
                <path d="M -15 -214 Q 0 -226 15 -214" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="grin">
                <path d="M -26 -232 L 26 -232 Q 24 -202 0 -202 Q -24 -202 -26 -232 Z" fill="#7A2A2A"/>
                <rect x="-19" y="-232" width="38" height="7" rx="3" fill="#FFFFFF"/>
                <rect x="6" y="-232" width="8" height="7" rx="2" fill="#F2C230"/>
              </g>
              <g data-group="mouth" data-swap="open">
                <rect x="-12" y="-232" width="24" height="22" rx="10" fill="#7A2A2A"/>
              </g>
              <g data-group="mouth" data-swap="wide">
                <rect x="-19" y="-230" width="38" height="13" rx="6" fill="#7A2A2A"/>
                <rect x="-14" y="-230" width="28" height="5" rx="2.5" fill="#FFFFFF"/>
                <rect x="4" y="-230" width="7" height="5" rx="1.5" fill="#F2C230"/>
              </g>
              <g data-group="mouth" data-swap="o">
                <rect x="-8" y="-230" width="16" height="17" rx="8" fill="#7A2A2A"/>
              </g>
              <g data-group="mouth" data-swap="u">
                <rect x="-6" y="-227" width="12" height="11" rx="5.5" fill="#7A2A2A"/>
              </g>
            </g>
          </g>

          <!-- short sleeves, bare forearms, gold watch on the left wrist -->
          <g data-part="arm_l" data-pivot="-84 -188">
            <rect x="-102" y="-206" width="36" height="52" rx="16" fill="#8A4FD8"/>
            <g data-part="fore_l" data-pivot="-84 -146">
              <rect x="-96" y="-160" width="24" height="60" rx="12" fill="#FFD3B0"/>
              <rect x="-98" y="-116" width="28" height="9" rx="4" fill="#F2C230"/>
              <rect x="-99" y="-106" width="30" height="30" rx="14" fill="#FFD3B0"/>
            </g>
            <rect x="-104" y="-170" width="40" height="16" rx="8" fill="#6A35B8"/>
          </g>
          <g data-part="arm_r" data-pivot="84 -188">
            <rect x="66" y="-206" width="36" height="52" rx="16" fill="#8A4FD8"/>
            <g data-part="fore_r" data-pivot="84 -146">
              <rect x="72" y="-160" width="24" height="60" rx="12" fill="#FFD3B0"/>
              <rect x="69" y="-106" width="30" height="30" rx="14" fill="#FFD3B0"/>
            </g>
            <rect x="64" y="-170" width="40" height="16" rx="8" fill="#6A35B8"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
