<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- 老年人 elder · origin = feet centre, y up is negative · same part names as young -->
  <g transform="translate(300 560)">
    <g data-part="shadow" data-pivot="0 0">
      <ellipse cx="0" cy="0" rx="84" ry="12" fill="#000" opacity="0.12"/>
    </g>
    <g data-part="root" data-pivot="0 0">
      <g data-part="body" data-pivot="0 0">

        <g data-part="leg_l" data-pivot="-27 -86">
          <rect x="-45" y="-96" width="36" height="82" rx="12" fill="#7D7F86"/>
          <rect x="-53" y="-25" width="48" height="25" rx="11" fill="#4A3426"/>
        </g>
        <g data-part="leg_r" data-pivot="27 -86">
          <rect x="9" y="-96" width="36" height="82" rx="12" fill="#7D7F86"/>
          <rect x="5" y="-25" width="48" height="25" rx="11" fill="#4A3426"/>
        </g>

        <g data-part="torso" data-pivot="0 -84">
          <!-- shirt under an open cardigan -->
          <rect x="-78" y="-208" width="156" height="138" rx="38" fill="#B9825A"/>
          <path d="M -30 -210 L 30 -210 L 12 -80 L -12 -80 Z" fill="#F3EBDD"/>
          <path d="M -30 -210 L -10 -160 L -22 -150 L -44 -204 Z" fill="#A87249"/>
          <path d="M 30 -210 L 10 -160 L 22 -150 L 44 -204 Z" fill="#A87249"/>
          <rect x="-76" y="-88" width="152" height="16" rx="8" fill="#A87249"/>
          <circle cx="-18" cy="-128" r="4.5" fill="#6B4A2E"/>
          <circle cx="-18" cy="-104" r="4.5" fill="#6B4A2E"/>
          <rect x="-66" y="-130" width="34" height="26" rx="9" fill="#A87249"/>
          <rect x="32" y="-130" width="34" height="26" rx="9" fill="#A87249"/>

          <g data-part="head" data-pivot="0 -198">
            <rect x="-100" y="-290" width="22" height="38" rx="10" fill="#F2B48C"/>
            <rect x="78" y="-290" width="22" height="38" rx="10" fill="#F2B48C"/>
            <rect x="-90" y="-358" width="180" height="166" rx="62" fill="#FFD3B0"/>
            <!-- bald crown with white side hair and one comb-over strand -->
            <path d="M -92 -262 C -100 -300 -92 -330 -72 -340 C -76 -316 -76 -292 -80 -262 Z" fill="#ECE8E1"/>
            <path d="M 92 -262 C 100 -300 92 -330 72 -340 C 76 -316 76 -292 80 -262 Z" fill="#ECE8E1"/>
            <g data-part="hair_tuft" data-pivot="10 -352">
              <path d="M -30 -350 Q 4 -366 40 -352" fill="none" stroke="#ECE8E1" stroke-width="7" stroke-linecap="round"/>
            </g>
            <path d="M -40 -330 Q -30 -334 -20 -330" fill="none" stroke="#F2B48C" stroke-width="3" stroke-linecap="round"/>
            <path d="M 20 -330 Q 30 -334 40 -330" fill="none" stroke="#F2B48C" stroke-width="3" stroke-linecap="round"/>

            <circle cx="-62" cy="-232" r="11" fill="#FF9E9E" opacity="0.45"/>
            <circle cx="62" cy="-232" r="11" fill="#FF9E9E" opacity="0.45"/>

            <g data-part="eyes" data-pivot="0 -274">
              <rect x="-52" y="-290" width="30" height="32" rx="12" fill="#FFFFFF"/>
              <rect x="22" y="-290" width="30" height="32" rx="12" fill="#FFFFFF"/>
              <g data-part="pupils" data-pivot="0 -274">
                <rect x="-44" y="-282" width="14" height="18" rx="6" fill="#2B2233"/>
                <rect x="30" y="-282" width="14" height="18" rx="6" fill="#2B2233"/>
                <rect x="-39" y="-279" width="5" height="5" rx="2.5" fill="#FFFFFF"/>
                <rect x="35" y="-279" width="5" height="5" rx="2.5" fill="#FFFFFF"/>
              </g>
              <!-- soft droopy lids -->
              <path d="M -54 -292 L -20 -292 L -20 -284 Q -37 -280 -54 -286 Z" fill="#F2B48C"/>
              <path d="M 54 -292 L 20 -292 L 20 -284 Q 37 -280 54 -286 Z" fill="#F2B48C"/>
            </g>
            <!-- crow's feet -->
            <path d="M -66 -284 L -74 -288 M -66 -276 L -75 -276" stroke="#E2A27C" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 66 -284 L 74 -288 M 66 -276 L 75 -276" stroke="#E2A27C" stroke-width="2.5" stroke-linecap="round"/>

            <!-- reading glasses sit on the face, not the eyes group, so blinking doesn't squash them -->
            <g fill="none" stroke="#6B4A2E" stroke-width="4">
              <rect x="-60" y="-298" width="46" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.12"/>
              <rect x="14" y="-298" width="46" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.12"/>
              <path d="M -14 -282 Q 0 -290 14 -282"/>
              <path d="M -60 -284 L -84 -280 M 60 -284 L 84 -280"/>
            </g>

            <g data-part="brow_l" data-pivot="-37 -312">
              <rect x="-58" y="-318" width="42" height="12" rx="6" fill="#D9D4CB"/>
            </g>
            <g data-part="brow_r" data-pivot="37 -312">
              <rect x="16" y="-318" width="42" height="12" rx="6" fill="#D9D4CB"/>
            </g>

            <rect x="-9" y="-254" width="18" height="20" rx="9" fill="#F2B48C"/>

            <g data-part="mouth" data-pivot="0 -220">
              <g data-group="mouth" data-swap="smile" data-default="">
                <path d="M -18 -224 Q 0 -210 18 -224" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="flat">
                <path d="M -12 -219 L 12 -219" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="sad">
                <path d="M -15 -212 Q 0 -224 15 -212" fill="none" stroke="#7A2A2A" stroke-width="5" stroke-linecap="round"/>
              </g>
              <g data-group="mouth" data-swap="grin">
                <path d="M -24 -228 L 24 -228 Q 22 -200 0 -200 Q -22 -200 -24 -228 Z" fill="#7A2A2A"/>
                <path d="M -11 -207 Q 0 -215 11 -207 Q 6 -200 0 -200 Q -6 -200 -11 -207 Z" fill="#FF7D7D"/>
                <rect x="-8" y="-228" width="16" height="6" rx="2" fill="#FFFFFF"/>
              </g>
              <g data-group="mouth" data-swap="open">
                <rect x="-11" y="-230" width="22" height="22" rx="10" fill="#7A2A2A"/>
              </g>
              <g data-group="mouth" data-swap="wide">
                <rect x="-18" y="-227" width="36" height="13" rx="6" fill="#7A2A2A"/>
              </g>
              <g data-group="mouth" data-swap="o">
                <rect x="-8" y="-228" width="16" height="17" rx="8" fill="#7A2A2A"/>
              </g>
              <g data-group="mouth" data-swap="u">
                <rect x="-6" y="-225" width="12" height="11" rx="5.5" fill="#7A2A2A"/>
              </g>
            </g>
          </g>

          <g data-part="arm_l" data-pivot="-84 -188">
            <rect x="-100" y="-204" width="32" height="68" rx="16" fill="#B9825A"/>
            <g data-part="fore_l" data-pivot="-84 -146">
              <rect x="-98" y="-156" width="28" height="54" rx="14" fill="#B9825A"/>
              <rect x="-99" y="-114" width="30" height="12" rx="6" fill="#A87249"/>
              <rect x="-99" y="-106" width="30" height="30" rx="14" fill="#FFD3B0"/>
            </g>
          </g>
          <g data-part="arm_r" data-pivot="84 -188">
            <rect x="68" y="-204" width="32" height="68" rx="16" fill="#B9825A"/>
            <g data-part="fore_r" data-pivot="84 -146">
              <rect x="70" y="-156" width="28" height="54" rx="14" fill="#B9825A"/>
              <rect x="69" y="-114" width="30" height="12" rx="6" fill="#A87249"/>
              <!-- handbag hangs from the hand; kept upright by the engine, swung by a spring -->
              <g data-part="bag" data-pivot="84 -84">
                <path d="M 70 -60 Q 70 -90 84 -90 Q 98 -90 98 -60" fill="none" stroke="#3B5A4A" stroke-width="5"/>
                <rect x="58" y="-66" width="52" height="42" rx="12" fill="#4E6E5D"/>
                <rect x="58" y="-66" width="52" height="12" rx="6" fill="#3B5A4A"/>
                <rect x="79" y="-58" width="10" height="8" rx="2" fill="#F2C230"/>
              </g>
              <rect x="69" y="-106" width="30" height="30" rx="14" fill="#FFD3B0"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
